apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Action test

on:
  push:
    branches:
    - '**'

jobs:
  unit-test:
    steps:
    - name: Get source code
      uses: cloudbees-io/checkout@v1

    - name: Install BATS
      uses: docker://alpine:3.18
      run: |
        apk add --no-cache bash curl tar
        curl -sSL https://github.com/bats-core/bats-core/archive/v1.10.0.tar.gz | tar -xz -C /tmp
        cd /tmp/bats-core-1.10.0 && ./install.sh /usr/local

    - name: Run BATS unit tests
      uses: docker://alpine:3.18
      run: |
        cd $CLOUDBEES_WORKSPACE
        bats tests/ --verbose

  test:
    permissions:
      scm-token-own: read
      id-token: write
    steps:
    - name: Get source code
      uses: cloudbees-io/checkout@v1

    - id: namegen
      name: Generate namespace name for test
      uses: docker://alpine:3.18
      run: |
        printf %.63s "create-k8s-ns-test-${{ cloudbees.scm.sha }}" > $CLOUDBEES_OUTPUTS/name

    - name: Login to AWS
      uses: cloudbees-io/configure-aws-credentials@v1
      id: aws-login
      with:
        aws-region: us-east-1
        role-to-assume: ${{ vars.oidc_staging_iam_role }}
        role-duration-seconds: "3600" # optionally set the duration of the login token

    - uses: cloudbees-io/configure-eks-credentials@v1
      with:
        name: ${{ vars.tekton_east_cluster_name }}

    - id: actionrunmax
      name: Run Action with all inputs specified
      uses: ./
      with:
        name: ${{ steps.namegen.outputs.name }}
        sanitize-name: 'false'
        fail-if-exists: 'true'
        labels: |
          cloudbees.io/cleanup: "true"
          example.com/some-label: some-value
          cloudbees.io/test-label: ${{ cloudbees.scm.sha }}

    - name: Test Action output maximum
      uses: docker://alpine/k8s:1.27.3
      run: |
        set -ux
        echo "$NAME" | grep -q '^create-k8s'
        kubectl get ns "$NAME"
        [ "$(kubectl get ns -l cloudbees.io/cleanup=true -l example.com/some-label=some-value -l cloudbees.io/test-label=${{ cloudbees.scm.sha }} | wc -l)" = 2 ]
      env:
        NAME: ${{ steps.actionrunmax.outputs.name }}

    - id: actionrunmin
      name: Run Action with no inputs specified
      uses: ./

    - name: Test Action output minimum
      uses: docker://alpine/k8s:1.27.3
      run: |
        set -ux
        NAME_PREFIX=$(printf %.8s "$BRANCH" | tr '[:upper:]' '[:lower:]')
        echo "$NAME" | grep -q "^b$NAME_PREFIX"
        kubectl get ns "$NAME"
      env:
        NAME: ${{ steps.actionrunmin.outputs.name }}
        BRANCH: ${{ cloudbees.scm.branch }}

    - id: actionrunexistingns
      name: Run Action again to verify it does not fail when ns exists
      uses: ./
      with:
        labels: |
          cloudbees.io/fancy-ns-test-label: "true"

    - name: Test Action rerun also returns name and does not add label
      uses: docker://alpine/k8s:1.27.3
      run: |
        set -ux
        NAME_PREFIX=$(printf %.8s "$BRANCH" | tr '[:upper:]' '[:lower:]')
        echo "$NAME" | grep -q "^b$NAME_PREFIX"
        kubectl get ns "$NAME"
        kubectl get ns "$NAME" -o yaml | grep -qv 'cloudbees.io/fancy-ns-test-label: "true"'
      env:
        NAME: ${{ steps.actionrunexistingns.outputs.name }}
        BRANCH: ${{ cloudbees.scm.branch }}

    - id: test-sanitization-underscore
      name: Test sanitization with underscores (original bug)
      uses: ./
      with:
        name: 'bfix-z_db-134751b'
        sanitize-name: 'true'
        labels: |
          cloudbees.io/cleanup: "true"
          test-type: sanitization-underscore

    - name: Validate underscore sanitization
      uses: docker://alpine/k8s:1.27.3
      run: |
        set -ux
        # Namespace should be created and RFC 1123 compliant
        kubectl get ns "$NAME"
        # Verify it's RFC 1123 compliant (lowercase alphanumeric + hyphens only)
        if ! echo "$NAME" | grep -qE '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'; then
          echo "ERROR: Namespace name '$NAME' is not RFC 1123 compliant"
          exit 1
        fi
        # Should not contain underscore
        if echo "$NAME" | grep -q '_'; then
          echo "ERROR: Namespace name '$NAME' still contains underscore"
          exit 1
        fi
        echo "✓ Underscore sanitization works correctly"
      env:
        NAME: ${{ steps.test-sanitization-underscore.outputs.name }}

    - id: test-sanitization-multiple-special
      name: Test sanitization with multiple special characters
      uses: ./
      with:
        name: 'feature/add_new_functionality@v1.2.3'
        sanitize-name: 'true'
        labels: |
          cloudbees.io/cleanup: "true"
          test-type: sanitization-special-chars

    - name: Validate multiple special char sanitization
      uses: docker://alpine/k8s:1.27.3
      run: |
        set -ux
        kubectl get ns "$NAME"
        # Verify RFC 1123 compliance
        if ! echo "$NAME" | grep -qE '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'; then
          echo "ERROR: Namespace name '$NAME' is not RFC 1123 compliant"
          exit 1
        fi
        echo "✓ Multiple special character sanitization works correctly"
      env:
        NAME: ${{ steps.test-sanitization-multiple-special.outputs.name }}

    - id: test-sanitization-dots
      name: Test sanitization with dots (another common issue)
      uses: ./
      with:
        name: 'a.b.c.d.e.f.g'
        sanitize-name: 'true'
        labels: |
          cloudbees.io/cleanup: "true"
          test-type: sanitization-dots

    - name: Validate dot sanitization
      uses: docker://alpine/k8s:1.27.3
      run: |
        set -ux
        kubectl get ns "$NAME"
        # Verify RFC 1123 compliance
        if ! echo "$NAME" | grep -qE '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'; then
          echo "ERROR: Namespace name '$NAME' is not RFC 1123 compliant"
          exit 1
        fi
        # Should not contain dots
        if echo "$NAME" | grep -q '\.'; then
          echo "ERROR: Namespace name '$NAME' still contains dots"
          exit 1
        fi
        echo "✓ Dot sanitization works correctly"
      env:
        NAME: ${{ steps.test-sanitization-dots.outputs.name }}

    - id: test-sanitization-mixed-case
      name: Test sanitization with mixed case and underscores
      uses: ./
      with:
        name: 'Feature_Branch_With_Underscores'
        sanitize-name: 'true'
        labels: |
          cloudbees.io/cleanup: "true"
          test-type: sanitization-mixed

    - name: Validate mixed case and underscore sanitization
      uses: docker://alpine/k8s:1.27.3
      run: |
        set -ux
        kubectl get ns "$NAME"
        # Verify RFC 1123 compliance
        if ! echo "$NAME" | grep -qE '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'; then
          echo "ERROR: Namespace name '$NAME' is not RFC 1123 compliant"
          exit 1
        fi
        # Should be lowercase only
        if echo "$NAME" | grep -q '[A-Z]'; then
          echo "ERROR: Namespace name '$NAME' still contains uppercase"
          exit 1
        fi
        # Should not contain underscores
        if echo "$NAME" | grep -q '_'; then
          echo "ERROR: Namespace name '$NAME' still contains underscores"
          exit 1
        fi
        echo "✓ Mixed case and underscore sanitization works correctly"
      env:
        NAME: ${{ steps.test-sanitization-mixed-case.outputs.name }}

    - name: Delete test Namespaces
      uses: docker://alpine/k8s:1.27.3
      run: |
        kubectl delete ns \
          "${{ steps.actionrunmax.outputs.name }}" \
          "${{ steps.actionrunmin.outputs.name }}" \
          "${{ steps.test-sanitization-underscore.outputs.name }}" \
          "${{ steps.test-sanitization-multiple-special.outputs.name }}" \
          "${{ steps.test-sanitization-dots.outputs.name }}" \
          "${{ steps.test-sanitization-mixed-case.outputs.name }}"
